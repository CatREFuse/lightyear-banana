<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030303" />
    <meta name="description" content="Mugen" />
    <title>Mugen</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="landing" aria-labelledby="brand-name">
      <div class="grain" aria-hidden="true"></div>
      <section class="hero">
        <h1 id="brand-name" class="brand" data-wordmark-brand>
          <img
            data-wordmark
            src="./assets/mugen-wordmark-4k.png"
            alt="Mugen"
            width="4096"
            height="2048"
            decoding="async"
            fetchpriority="high"
          />
          <span class="wordmark-fallback">Mugen</span>
        </h1>

        <div class="optical-stage" data-optical-stage aria-hidden="true">
          <canvas class="prism-canvas" data-prism-canvas></canvas>
          <div class="prism-fallback"></div>
        </div>

        <div class="release-actions" aria-label="Mugen releases">
          <a
            class="liquid-button"
            data-download="ccx"
            href="__MUGEN_RELEASE_ORIGIN__/releases/1.0.0/mugen-1.0.0.ccx"
          >
            <span>Download CCX</span>
          </a>
          <a class="liquid-button" data-open-webui href="./webui/">
            <span>Open WebUI</span>
          </a>
        </div>

        <p class="specimen">CCX · Specimen No. <span data-ccx-version>1.0.0</span></p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
