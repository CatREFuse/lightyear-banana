<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030303" />
    <meta name="description" content="Mugen" />
    <title>Mugen</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="landing" aria-labelledby="brand-name">
      <div class="grain" aria-hidden="true"></div>
      <section class="hero">
        <h1 id="brand-name" class="brand" data-wordmark-brand>
          <img
            data-wordmark
            src="./assets/mugen-wordmark-imagegen-v2-4k.png"
            alt="Mugen"
            width="4096"
            height="2048"
            decoding="async"
            fetchpriority="high"
          />
          <span class="wordmark-fallback">Mugen</span>
        </h1>

        <div class="optical-stage" data-optical-stage aria-hidden="true">
          <canvas class="prism-canvas" data-prism-canvas></canvas>
          <div class="prism-fallback"></div>
        </div>

        <aside class="parameter-panel" data-prism-panel hidden aria-label="光路参数">
          <button class="panel-close" data-prism-panel-close type="button" aria-label="关闭参数面板">×</button>
          <label class="panel-row">
            <span>色散偏移</span>
            <input data-prism-param="dispersionOffsetScale" type="range" min="0" max="5" step="0.01" value="2.5" />
            <output data-prism-output="dispersionOffsetScale">2.50x</output>
          </label>
          <label class="panel-row">
            <span>红光 n</span>
            <input data-prism-param="baseGlassIor" type="range" min="1.3" max="1.8" step="0.005" value="1.3" />
            <output data-prism-output="baseGlassIor">1.300</output>
          </label>
          <label class="panel-row">
            <span>转速</span>
            <input data-prism-param="rotationSpeed" type="range" min="0.1" max="2.5" step="0.05" value="0.55" />
            <output data-prism-output="rotationSpeed">0.55x</output>
          </label>
          <label class="panel-row">
            <span>入射角</span>
            <input data-prism-param="incidentAngle" type="range" min="-10" max="10" step="0.1" value="8" />
            <output data-prism-output="incidentAngle">8.0°</output>
          </label>
        </aside>

        <div class="release-actions" aria-label="Mugen releases">
          <a
            class="liquid-button"
            data-download="ccx"
            href="__MUGEN_RELEASE_ORIGIN__/download/mugen-1.1.7-2608140002.ccx"
          >
            <span>Download CCX</span>
          </a>
          <a class="liquid-button" data-open-webui href="./webui/">
            <span>Open WebUI</span>
          </a>
        </div>

        <p class="specimen">CCX · Specimen No. <span data-ccx-version>1.1.7</span> · Build <span data-ccx-build>2608140002</span></p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
