name: Legacy Package Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      INNER_WEBUI_URL: ${{ secrets.INNER_WEBUI_URL }}
      INNER_RELEASE_URL: ${{ secrets.INNER_RELEASE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Verify requested version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne '${{ inputs.version }}') {
            throw "package.json is $packageVersion, expected ${{ inputs.version }}"
          }

      - name: Run diagnostics tests
        run: npm run legacy:test:diagnostics

      - name: Package verified CCX
        run: npm run package:ccx

      - name: Package Windows app
        run: npm run legacy:package:electron:win:prepared

      - name: Verify Windows archive
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $archive = "dist/mugen-$version-win.zip"
          $extract = "dist/windows-release-check"
          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Missing $archive"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $packageJson = Get-ChildItem -Path $extract -Filter package.json -Recurse |
            Where-Object { $_.FullName -like '*resources*app*package.json' } |
            Select-Object -First 1
          if (-not $packageJson) {
            throw 'Packaged package.json was not found'
          }
          $packagedVersion = (Get-Content $packageJson.FullName -Raw | ConvertFrom-Json).version
          if ($packagedVersion -ne $version) {
            throw "Packaged version is $packagedVersion, expected $version"
          }
          $appResources = Split-Path -Parent $packageJson.FullName
          $ccxMetadataPath = Join-Path $appResources 'dist/ccx-release.json'
          if (-not (Test-Path $ccxMetadataPath -PathType Leaf)) {
            throw 'Packaged CCX release metadata was not found'
          }
          $ccxMetadata = Get-Content $ccxMetadataPath -Raw | ConvertFrom-Json
          $packagedCcx = Join-Path $appResources "dist/$($ccxMetadata.filename)"
          if (-not (Test-Path $packagedCcx -PathType Leaf)) {
            throw "Missing packaged CCX: $packagedCcx"
          }
          $ccxHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagedCcx).Hash.ToLowerInvariant()
          if ($ccxHash -ne $ccxMetadata.sha256) {
            throw 'Packaged CCX does not match ccx-release.json'
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  mugen-$version-win.zip" | Set-Content "$archive.sha256" -Encoding ascii
          Get-Item $archive | Select-Object FullName, Length
          Get-Content "$archive.sha256"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mugen-${{ inputs.version }}-windows
          path: |
            dist/mugen-${{ inputs.version }}-win.zip
            dist/mugen-${{ inputs.version }}-win.zip.sha256
          if-no-files-found: error
          retention-days: 7
